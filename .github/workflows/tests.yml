name: tests

on:
  push:
  pull_request:

jobs:
  deterministic-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic recovery fixture
        run: python -m unittest discover -s tests -v
